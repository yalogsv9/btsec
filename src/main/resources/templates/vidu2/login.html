<!doctype html><html lang="vi" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập ví dụ 2</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="card narrow"><p class="eyebrow">Ví dụ 2 · H2/JPA</p><h1>Đăng nhập</h1><p class="alert" th:if="${param.error}" role="alert">Username/email hoặc password không đúng.</p><p class="notice" th:if="${param.logout}">Bạn đã đăng xuất.</p><form th:action="@{/vidu2/login}" method="post"><label for="username">Username hoặc email</label><input id="username" name="username" required autofocus><label for="password">Mật khẩu</label><input id="password" type="password" name="password" required><button type="submit">Đăng nhập</button></form><p class="hint">user01 hoặc user01@gmail.com / 123456</p></main></body></html>
